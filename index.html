  #upd{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:10px;max-width:92vw;padding:10px 10px 10px 16px;border-radius:18px;background:rgba(20,28,58,.9);border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:Outfit,system-ui,sans-serif;color:#fff}
  #upd.show{display:flex}
  #upd .t{font-size:14px;line-height:1.25}#upd .t b{font-weight:800}
  #upd button{border:0;border-radius:12px;padding:9px 14px;font:800 14px Outfit,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
  #upd .go{background:linear-gradient(90deg,#ff7a3d,#ffa94d);color:#fff}#upd .no{background:transparent;color:rgba(255,255,255,.7);padding:9px 8px}
  #set .btnrow{display:flex;gap:8px;align-items:center;margin-top:8px}#set .btnrow button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:11px;padding:9px 14px;font:700 13px Outfit,system-ui,sans-serif;cursor:pointer}

<style>
  html,body{margin:0;height:100%;background:#02040c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;cursor:pointer}

  #set{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-sizing:border-box;display:none;align-items:center;justify-content:center;background:rgba(2,4,14,.5);z-index:10;font-family:Outfit,system-ui,sans-serif;color:#fff;touch-action:pan-y;-webkit-user-select:none;user-select:none}
  #set.open{display:flex}
  #set .panel{width:min(430px,92vw);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(38,48,86,.94),rgba(18,24,48,.96));border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
  #set .hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
  #set .hd b{font-weight:800;font-size:24px;letter-spacing:.01em}
  #set .x{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:18px;line-height:1;cursor:pointer}
  #set .body{overflow-y:auto;padding:0 20px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #set .sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffb27a;font-weight:600;margin:18px 0 4px}
  #set .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
  #set .row.col{flex-direction:column;align-items:stretch;cursor:default}
  #set .lbl{font-weight:600;font-size:15.5px}
  #set .desc{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:2px}
  #set .tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;background:rgba(255,120,80,.22);color:#ffb39a}
  #set .tag.l{background:rgba(120,220,160,.18);color:#9fe8bd}
  #set .sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
  #set .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  #set .sw.on{background:linear-gradient(90deg,#ff7a3d,#ffa94d)}#set .sw.on::after{left:23px}
  #set .seg{display:flex;flex-wrap:wrap;background:rgba(255,255,255,.09);border-radius:12px;padding:3px;gap:3px;margin-top:9px}
  #set .seg button{flex:1 1 17%;min-width:56px;border:0;background:transparent;color:#fff;font:600 13px Outfit,system-ui,sans-serif;padding:9px 2px;border-radius:9px;cursor:pointer}
  #set .seg button.on{background:#fff;color:#1b2346}
  #set .ft{padding:10px 20px 16px;font-size:12px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.08)}
  #set .rs{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;font:600 12px Outfit,system-ui;padding:6px 10px;cursor:pointer}

  #skins{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-sizing:border-box;display:none;align-items:center;justify-content:center;background:rgba(2,4,14,.5);z-index:11;font-family:Outfit,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #skins.open{display:flex}
  #skins .panel{width:min(460px,94vw);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(38,48,86,.95),rgba(18,24,48,.97));border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
  #skins .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
  #skins .hd b{font-weight:800;font-size:24px}
  #skins .x{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}
  #skins .pv{margin:0 16px;border-radius:18px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.15);flex:none}
  #skins .pv canvas{display:block;width:100%;height:190px}
  #skins .info{padding:10px 14px 12px;background:rgba(0,0,0,.28)}
  #skins .nm{font-weight:800;font-size:19px}
  #skins .sci{font-style:italic;font-size:13px;color:rgba(255,255,255,.6);margin-top:1px}
  #skins .fact{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:6px;line-height:1.35;min-height:36px}
  #skins .eq{position:absolute;right:12px;top:12px;border:0;border-radius:14px;padding:10px 18px;font:800 15px Outfit,system-ui,sans-serif;color:#1b2346;background:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #skins .eq.on{background:linear-gradient(90deg,#ff7a3d,#ffa94d);color:#fff}
  #skins .body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #skins .sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffb27a;font-weight:600;margin:14px 0 8px}
  #skins .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
  #skins .card{position:relative;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.08);padding:4px 4px 7px;text-align:center;cursor:pointer}
  #skins .card canvas{display:block;margin:0 auto;width:100%;height:auto}
  #skins .card span{display:block;font-size:11.5px;font-weight:600;line-height:1.2;margin-top:1px}
  #skins .card.sel{border-color:#fff;background:rgba(255,255,255,.16)}
  #skins .card .ok{position:absolute;top:5px;right:6px;width:18px;height:18px;border-radius:50%;background:#ff8a3d;font-size:11px;line-height:18px;font-weight:800}
</style>
</head>

<script>
(() => {
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const H=640, GH=112, GY=H-GH, PW=78;
const GRAV=1750, FLAP=-505;
const FONT='"Outfit", system-ui, -apple-system, sans-serif';
let W=400,S=1,DPR=1;

// ---------- helpers ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const hex=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const mixRGB=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+[0,1,2].map(i=>Math.round(lerp(A[i],B[i],t)).toString(16).padStart(2,'0')).join('');};
const rgba=(h,a)=>{const [r,g,b]=hex(h);return `rgba(${r},${g},${b},${a})`;};
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function mk(w,h,R,fn){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*R));c.height=Math.max(1,Math.ceil(h*R));const g=c.getContext('2d');g.scale(R,R);fn(g);return c;}
const FILTER=(()=>{try{const a=document.createElement('canvas');a.width=a.height=2;const ac=a.getContext('2d');ac.fillStyle='#fff';ac.fillRect(0,0,2,2);
  const b=document.createElement('canvas');b.width=b.height=2;const bc=b.getContext('2d');bc.filter='brightness(0)';bc.drawImage(a,0,0);return bc.getImageData(0,0,1,1).data[0]<10;}catch(e){return false;}})();

// ---------- quality tiers ----------
const coarse=matchMedia('(pointer:coarse)').matches;
const PRESETS={
  low:  {res:'1',     vol:0,rays:1,bloom:0,flare:0,refl:'1',clouds:1,motes:0,grain:0,vignette:1,glass:0},
  med:  {res:'1.5',   vol:1,rays:0,bloom:0,flare:1,refl:'2',clouds:1,motes:1,grain:0,vignette:1,glass:0},
  high: {res:'2',     vol:1,rays:0,bloom:1,flare:1,refl:'3',clouds:1,motes:1,grain:1,vignette:1,glass:1},
  ultra:{res:'native',vol:1,rays:0,bloom:1,flare:1,refl:'3',clouds:1,motes:1,grain:1,vignette:1,glass:1},
};
const LADDER=['ultra','high','med','low'],GFX=['res','vol','rays','bloom','flare','refl','clouds','motes','vignette','grain','glass'];
const TOD={day:0,sunset:.9,night:2,dawn:3.1};
let autoLvl=coarse?2:1,dprScale=1,Q={};
let set=Object.assign({channel:'stable',betaUnlocked:0,autoupd:1,pcres:'native',skin:'robin',preset:'auto',tod:'cycle',shake:1,fps:0,amb:'2',sfxv:'3',amb:'2',sfxv:'3',cap:coarse?'60':'max'},PRESETS[LADDER[autoLvl]]);
try{Object.assign(set,JSON.parse(localStorage.getItem('skyflap_settings')||'{}'));}catch(e){}
const applyPreset=n=>{if(PRESETS[n])Object.assign(set,PRESETS[n]);};
if(set.preset==='auto')applyPreset(LADDER[autoLvl]);else applyPreset(set.preset);
function saveSet(){try{localStorage.setItem('skyflap_settings',JSON.stringify(set));}catch(e){}}
function computeQ(){const base=set.res==='native'?3:+set.res,l=+set.refl;
  Q={dpr:base,bloom:+set.bloom,grain:+set.grain,rays:set.rays?(base>=2?16:10):0,flare:+set.flare,blur:+set.glass,vol:+set.vol,
     water:[3,3,2,1.5][l],refl:[0,.3,.45,.6][l],sky:base>=2?.6:base>=1.5?.45:.35,skyEvery:base>=2?3:5,glints:set.flare?30:16,
     motes:set.motes?40:0,step:base>=2?6:base>=1.5?8:10,clouds:+set.clouds,vignette:+set.vignette};}
computeQ();

// ---------- static textures ----------
const grime=document.createElement('canvas');grime.width=128;grime.height=512;
(()=>{const g=grime.getContext('2d');
  for(let i=0;i<90;i++){const x=Math.random()*128,y=Math.random()*512,l=20+Math.random()*140;
    const gr=g.createLinearGradient(0,y,0,y+l);gr.addColorStop(0,'rgba(50,30,12,0)');gr.addColorStop(.25,`rgba(50,30,12,${.05+Math.random()*.18})`);gr.addColorStop(1,'rgba(50,30,12,0)');
    g.fillStyle=gr;g.fillRect(x,y,.6+Math.random()*2.6,l);}
  for(let i=0;i<26;i++){const x=Math.random()*128,y=Math.random()*512,r=2+Math.random()*9;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(150,72,24,.38)');gr.addColorStop(1,'rgba(150,72,24,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  for(let i=0;i<40;i++){g.strokeStyle=`rgba(255,255,255,${Math.random()*.08})`;g.lineWidth=.5;const x=Math.random()*128,y=Math.random()*512;g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-6,6),y+rnd(2,10));g.stroke();}
})();
const noise=document.createElement('canvas');noise.width=noise.height=128;
(()=>{const g=noise.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);})();
const noisePat=ctx.createPattern(noise,'repeat');
function makeCloud(seed){
  let s=seed*9973;const R=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const w=300,h=130;
  return mk(w,h,1.25,g=>{
    for(let i=0;i<46;i++){const u=(R()+R()+R())/3,x=30+u*240,dx=Math.abs(x-150)/120,r=(13+R()*28)*(1-dx*.5),y=h-26-r*.35-R()*(1-dx)*44;
      const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.5,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
    g.globalCompositeOperation='source-atop';
    const sh=g.createLinearGradient(0,25,0,h);sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(150,160,190,.38)');sh.addColorStop(1,'rgba(80,90,125,.8)');g.fillStyle=sh;g.fillRect(0,0,w,h);
    const hl=g.createRadialGradient(w*.72,8,0,w*.72,8,w*.6);hl.addColorStop(0,'rgba(255,246,228,.7)');hl.addColorStop(1,'rgba(255,246,228,0)');g.fillStyle=hl;g.fillRect(0,0,w,h);
  });
}
const cloudSprites=[1,2,3,4,5,6].map(makeCloud);
const glow=mk(64,64,1,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,248,215,1)');gr.addColorStop(.35,'rgba(255,225,150,.45)');gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});

// ---------- robin (pre-rendered into sprites) ----------
function featherPath(c,L,Wd){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-L*.45,-Wd,-L,-Wd*.12);c.quadraticCurveTo(-L*.55,Wd*.75,0,0);c.closePath();}
const dk=(h,k)=>k>=1?h:mixRGB(h,'#000000',1-k);
function drawWing(c,flap,far,dead){
  const k=far?.5:1,ang=dead?-.25:.18+flap*1.12;
  c.save();c.rotate(ang);c.scale(1,.78+.32*Math.abs(flap));
  const spread=dead?0:Math.max(0,-flap);
  for(let i=6;i>=0;i--){c.save();c.translate(-6-i*1.7,1.5+i*.35);c.rotate(-(-.14+i*.105)*(1+spread*.5));
    const L=i<4?28-i*1.8:21.5-(i-4)*2.2;
    const g=c.createLinearGradient(0,0,-L,0);g.addColorStop(0,dk('#5c4631',k));g.addColorStop(.65,dk('#33261a',k));g.addColorStop(1,dk('#140e09',k));
    featherPath(c,L,3.7);c.fillStyle=g;c.fill();c.strokeStyle=`rgba(228,198,150,${.42*k})`;c.lineWidth=.55;c.stroke();
    c.strokeStyle=`rgba(0,0,0,${.4*k})`;c.lineWidth=.45;c.beginPath();c.moveTo(-1,0);c.lineTo(-L*.9,-.4);c.stroke();c.restore();}
  const cg=c.createLinearGradient(0,-6,0,7);cg.addColorStop(0,dk('#a27c4e',k));cg.addColorStop(1,dk('#654829',k));
  c.beginPath();c.moveTo(3.5,-3);c.bezierCurveTo(-4,-7.5,-16,-5.5,-21,0);c.bezierCurveTo(-14,5.5,-4,6.5,3.5,3);c.closePath();c.fillStyle=cg;c.fill();
  c.strokeStyle=`rgba(40,24,10,${.45*k})`;c.lineWidth=.6;
  for(let r=0;r<2;r++)for(let j=0;j<5;j++){c.beginPath();c.arc(-2-j*3.6-r*1.8,-1.6+r*3,2.2,.3,Math.PI-.3);c.stroke();}
  c.strokeStyle=`rgba(242,222,182,${.6*k})`;c.lineWidth=1.1;c.beginPath();c.moveTo(-3,3.3);c.quadraticCurveTo(-11,5.2,-19,1.5);c.stroke();
  if(!far){const hl=c.createLinearGradient(0,-7,0,0);hl.addColorStop(0,'rgba(255,238,205,.55)');hl.addColorStop(1,'rgba(255,238,205,0)');
    c.beginPath();c.moveTo(3.5,-3);c.bezierCurveTo(-4,-7.5,-16,-5.5,-21,0);c.strokeStyle=hl;c.lineWidth=1.4;c.stroke();}
  c.restore();
}
function bodyPath(c){c.beginPath();c.moveTo(20,-6);c.bezierCurveTo(19,-13,11,-16,4,-14.5);c.bezierCurveTo(0,-13.6,-2,-11.6,-5,-11.5);
  c.bezierCurveTo(-12,-11.4,-18,-7,-22,-1);c.bezierCurveTo(-17,9,-6,14,4,12.5);c.bezierCurveTo(12,11,18,6,20,0);c.closePath();}
function drawBodyParts(c,dead){
  // tail
  c.save();c.translate(-19,-2);c.rotate(.04);
  for(let i=0;i<5;i++){c.save();c.rotate(-.13+i*.065);const L=25-Math.abs(i-2)*1.6,g=c.createLinearGradient(0,0,-L,0);g.addColorStop(0,'#6e5236');g.addColorStop(1,'#241a11');
    featherPath(c,L,3.4);c.fillStyle=g;c.fill();c.strokeStyle='rgba(222,192,142,.35)';c.lineWidth=.55;c.stroke();c.restore();}
  c.restore();
  // legs
  c.strokeStyle='#5d4a3b';c.lineWidth=1.5;c.lineCap='round';c.beginPath();c.moveTo(-2,10);c.lineTo(-7,13.5);c.lineTo(-10.5,13);c.moveTo(1,10.5);c.lineTo(-3,14.2);c.lineTo(-6.5,14.3);c.stroke();
  // body
  bodyPath(c);let g=c.createLinearGradient(0,-15,0,13);g.addColorStop(0,'#6a4f33');g.addColorStop(.5,'#8a6944');g.addColorStop(1,'#c7a47a');c.fillStyle=g;c.fill();
  c.save();bodyPath(c);c.clip();
  g=c.createRadialGradient(13,1,1,11,1,15.5);g.addColorStop(0,'#ff8c40');g.addColorStop(.6,'#e85c20');g.addColorStop(1,'rgba(205,85,30,0)');c.fillStyle=g;c.beginPath();c.ellipse(11,1,15.5,13.5,0,0,7);c.fill();
  c.strokeStyle='rgba(160,168,178,.42)';c.lineWidth=2.6;c.beginPath();c.ellipse(11,1,14.8,12.8,0,Math.PI*.92,Math.PI*1.62);c.stroke();
  g=c.createRadialGradient(-4,11,1,-4,11,13);g.addColorStop(0,'rgba(250,243,230,.95)');g.addColorStop(1,'rgba(250,243,230,0)');c.fillStyle=g;c.fillRect(-22,-2,32,18);
  c.strokeStyle='rgba(35,22,10,.22)';c.lineWidth=.55;
  for(let r=0;r<3;r++)for(let j=0;j<7;j++){c.beginPath();c.arc(4-j*3.5-r*1.7,-11.2+r*3.2+j*.6,2,.3,Math.PI-.3);c.stroke();}
  c.strokeStyle='rgba(255,220,190,.22)';for(let j=0;j<6;j++){c.beginPath();c.arc(10+(j%3)*3.5,-1+Math.floor(j/3)*3.5,1.8,.4,Math.PI-.4);c.stroke();}
  g=c.createRadialGradient(8,-13,0,8,-13,27);g.addColorStop(0,'rgba(255,244,220,.5)');g.addColorStop(1,'rgba(255,244,220,0)');c.fillStyle=g;c.fillRect(-25,-20,50,40);
  g=c.createLinearGradient(0,-2,0,14);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,10,0,.45)');c.fillStyle=g;c.fillRect(-25,-2,50,18);
  bodyPath(c);g=c.createLinearGradient(0,-16,0,-1);g.addColorStop(0,'rgba(255,236,200,.95)');g.addColorStop(1,'rgba(255,236,200,0)');c.strokeStyle=g;c.lineWidth=2.4;c.stroke();
  c.restore();
  bodyPath(c);c.strokeStyle='rgba(25,15,6,.5)';c.lineWidth=.7;c.stroke();
  // beak
  c.beginPath();c.moveTo(19.4,-7.2);c.quadraticCurveTo(25,-6.8,29.2,-4.2);c.lineTo(19.8,-3.4);c.closePath();
  g=c.createLinearGradient(0,-7,0,-3);g.addColorStop(0,'#5a524b');g.addColorStop(1,'#141210');c.fillStyle=g;c.fill();
  c.beginPath();c.moveTo(19.8,-3.4);c.lineTo(27.8,-3.9);c.quadraticCurveTo(24,-1.1,19.4,-.9);c.closePath();c.fillStyle='#2a2623';c.fill();
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=.6;c.beginPath();c.moveTo(20.5,-6.4);c.quadraticCurveTo(24.5,-6.1,27.6,-4.6);c.stroke();
  // eye
  c.fillStyle='rgba(70,35,12,.55)';c.beginPath();c.arc(12,-8,3.7,0,7);c.fill();
  if(dead){c.strokeStyle='#1a120c';c.lineWidth=1.1;c.beginPath();c.moveTo(9.6,-8);c.quadraticCurveTo(12,-6.6,14.4,-8);c.stroke();}
  else{g=c.createRadialGradient(11.3,-8.7,.3,12,-8,3);g.addColorStop(0,'#3c2e24');g.addColorStop(1,'#050403');c.fillStyle=g;c.beginPath();c.arc(12,-8,2.85,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(13,-9.1,.95,0,7);c.fill();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(11.1,-6.9,.45,0,7);c.fill();}
}


// ---------- bird species: parametric renderer ----------
const TAU=Math.PI*2;
function cub(P,t){const u=1-t;return [u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]];}
function tubePath(c,P,w0,w1,n=16){const A=[],B=[];
  for(let i=0;i<=n;i++){const t=i/n,p=cub(P,t),q=cub(P,Math.min(1,t+.01)),r=cub(P,Math.max(0,t-.01));let dx=q[0]-r[0],dy=q[1]-r[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=lerp(w0,w1,t)/2;A.push([p[0]-dy*w,p[1]+dx*w]);B.push([p[0]+dy*w,p[1]-dx*w]);}
  const poly=A.concat(B.reverse());let ar=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];ar+=p[0]*q[1]-q[0]*p[1];}
  if(ar>0)poly.reverse();c.moveTo(poly[0][0],poly[0][1]);for(const p of poly)c.lineTo(p[0],p[1]);c.closePath();}
function silhouette(c,sp){
  const b=sp.body,h=sp.head;
  c.moveTo(b.f,-b.t*.25);
  c.bezierCurveTo(b.f*.95,-b.t,b.f*.1,-b.t*1.08,-b.r*.35,-b.t*.95);
  c.bezierCurveTo(-b.r*.75,-b.t*.85,-b.r,-b.t*.35,-b.r,0);
  c.bezierCurveTo(-b.r*.85,b.u*.85,-b.r*.25,b.u*1.08,b.f*.15,b.u);
  c.bezierCurveTo(b.f*.75,b.u*.95,b.f*1.08,b.u*.35,b.f,-b.t*.25);c.closePath();
  const n=sp.neck;
  if(n&&n.pts)tubePath(c,n.pts,n.w0,n.w1);
  else{const x0=b.f*.45,y0=-b.t*.5,x1=h.x-h.r*.35,y1=h.y+h.r*.2,w=(n&&n.w)||h.r*1.75;
    tubePath(c,[[x0,y0],[lerp(x0,x1,.35),lerp(y0,y1,.35)],[lerp(x0,x1,.7),lerp(y0,y1,.7)],[x1,y1]],w*1.15,w);}
  c.moveTo(h.x+h.r,h.y);c.ellipse(h.x,h.y,h.r,h.r*(h.ry||1),h.rot||0,0,-TAU,true);
}
function paintPatch(c,p){
  c.save();const a=p.a==null?1:p.a;
  if(p.t==='e'){c.translate(p.x,p.y);c.rotate(p.r||0);c.scale(1,p.ry/p.rx);
    const g=c.createRadialGradient(0,0,0,0,0,p.rx);g.addColorStop(0,rgba(p.c,a));g.addColorStop(p.soft==null?.7:p.soft,rgba(p.c,a));g.addColorStop(1,rgba(p.c,0));
    c.fillStyle=g;c.fillRect(-p.rx,-p.rx,p.rx*2,p.rx*2);}
  else if(p.t==='s'){c.strokeStyle=rgba(p.c,a);c.lineWidth=p.w;c.lineCap='round';c.lineJoin='round';c.beginPath();const P=p.pts;c.moveTo(P[0][0],P[0][1]);
    if(P.length===3)c.quadraticCurveTo(P[1][0],P[1][1],P[2][0],P[2][1]);else for(const q of P.slice(1))c.lineTo(q[0],q[1]);c.stroke();}
  else if(p.t==='f')p.fn(c);
  c.restore();
}
function drawEyeSp(c,sp,dead){
  const e=sp.eye;
  if(e.skin){c.fillStyle=e.skin.c;c.beginPath();c.ellipse(e.x+(e.skin.dx||0),e.y+(e.skin.dy||0),e.skin.rx,e.skin.ry,0,0,TAU);c.fill();
    if(e.skin.lines){c.strokeStyle=e.skin.lines;c.lineWidth=.35;for(let i=0;i<4;i++){c.beginPath();c.arc(e.x+1,e.y+1.2,e.r+1.4+i*.9,1.9,3.1);c.stroke();}}}
  if(e.ring){c.fillStyle=e.ring;c.beginPath();c.arc(e.x,e.y,e.r+(e.rw||.6),0,TAU);c.fill();}
  else{c.fillStyle='rgba(30,18,8,.45)';c.beginPath();c.arc(e.x,e.y,e.r+.7,0,TAU);c.fill();}
  if(dead){c.strokeStyle='#120c08';c.lineWidth=Math.max(.7,e.r*.38);c.lineCap='round';c.beginPath();c.moveTo(e.x-e.r,e.y);c.quadraticCurveTo(e.x,e.y+e.r*.6,e.x+e.r,e.y);c.stroke();return;}
  if(e.iris){c.fillStyle=e.iris;c.beginPath();c.arc(e.x,e.y,e.r,0,TAU);c.fill();c.fillStyle='#070505';c.beginPath();c.arc(e.x+e.r*.12,e.y,e.r*(e.pupil||.55),0,TAU);c.fill();}

  speed=state==='dead'?0:state==='play'?165+Math.min(score,60)*1.6:105;
  scroll+=speed*dt;
  for(const c of clouds){c.x-=(speed*c.p+5)*dt;if(c.x<-420){c.x=W+rnd(40,400);c.y=rnd(30,260);c.s=rnd(.55,1.25);}}

  if(state==='menu'){bird.y=H*.43+Math.sin(time*3)*11;bird.rot=Math.sin(time*3+1)*.07;bird.wing+=dt*15;}
  else if(state==='play'){

    const target=bird.vy<0?-.38:clamp((bird.vy-120)/520,-.38,1.35);bird.rot=lerp(bird.rot,target,1-Math.pow(.0005,dt));
    bird.wing+=dt*(bird.vy<0?32:bird.vy>380?4:12);

    for(const p of pipes)p.x-=speed*dt;
    if(pipes.length&&pipes[0].x<-PW-30)pipes.shift();
    const last=pipes[pipes.length-1];if(last.x<W-238)spawnPipe(last.x+238);

        const hsNow=!hsPlayed&&best>0&&score===best+1;if(hsNow){hsPlayed=true;birdCall('hs',null,1);pops.push({x:W/2,y:165,s:'NEW BEST!',life:0});}
        if(score%10===0){sfx.milestone();if(!hsNow){birdCall('ten');pops.push({x:W/2,y:165,s:score+'!',life:0});}}else sfx.score();
        for(let i=0;i<10;i++){const a=rnd(0,Math.PI*2),v=rnd(40,170);parts.push({t:'spark',x:p.x+PW/2,y:p.gy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(.3,.7),s:rnd(1,2.6)});}}

    }

    if(!bird.inWater){bird.vy=Math.min(bird.vy+GRAV*dt,1000);bird.y+=bird.vy*dt;bird.rot=lerp(bird.rot,1.3,1-Math.pow(.003,dt));if(bird.y>GY-3){bird.inWater=true;splash(bird.x);}}

  for(const p of parts){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t==='feather'){p.vy=Math.min(p.vy+300*dt,60);p.vx*=Math.pow(.25,dt);p.r+=p.vr*dt;p.x+=Math.sin(p.life*5+p.r)*20*dt;}

    else{p.vx*=Math.pow(.1,dt);p.vy*=Math.pow(.1,dt);}}

  for(const d of drops){d.life+=dt;d.vy+=1300*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>GY&&d.vy>0){d.dead=true;if(Math.random()<.2)ripples.push({x:d.x,t:0,max:.7,s:.35});if(Math.random()<.12)sfx.drop();}}

      const x=i*sp-off+hash(i+seed)*sp*.7,h=hMin+hash(i*1.7+seed)*(hMax-hMin),w=h*.3,y=baseY+hash(i*2.3+seed)*5;

function bloomPass(){

      const k=S*c.width/cv.width;x.setTransform(k,0,0,k,0,0);x.globalCompositeOperation='source-over';x.fillStyle='#000';x.beginPath();
      for(const p of pipes){const top=p.gy-p.gap/2,bot=p.gy+p.gap/2;x.rect(p.x,-40,PW,top+40);x.rect(p.x-7,top-30,PW+14,30);x.rect(p.x,bot,PW,GY+20-bot);x.rect(p.x-7,bot,PW+14,30);}
      x.fill();x.setTransform(1,0,0,1,0,0);}

let frame=0;
function render(){
  frame++;const P=palette(phase),sun=sunInfo();if(SRC.length<SRCN||SRC.includes(undefined))prebuildSrc();
  if(++skyAge>=Q.skyEvery){renderSky(P,sun);skyAge=0;}
  const c=ctx,shk=set.shake?shake:0,shx=(Math.random()-.5)*shk,shy=(Math.random()-.5)*shk;
  c.setTransform(S,0,0,S,shx*S,shy*S);c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.drawImage(skyC,-2,-2,W+4,GY+16);
  drawClouds(c,false);
  drawLayer(c,LAYERS[0],P);
  drawClouds(c,true);
  drawLayer(c,LAYERS[1],P);
  drawLayer(c,LAYERS[2],P);
  drawLayer(c,LAYERS[3],P);
  volLight(c,P,sun);   // light shafts live in the air behind the pipes/bird: they no longer streak across the pipes
  if(bA)bloomPass();   // glare is computed from the static scene (sky, sun, land, shafts) before pipes/bird: nothing moving can make it flicker
  drawMotes(c,P,sun);
  for(const p of pipes)drawPipe(c,p);
  drawParts(c);
  if(P.star>.3){c.globalCompositeOperation='lighter';c.globalAlpha=.3*P.star;c.drawImage(glow,bird.x-60,bird.y-60,120,120);c.globalAlpha=1;c.globalCompositeOperation='source-over';}
  drawBird(c);
  drawWater(P,sun);
  const graded=P.gr!=='#ffffff';
  if(graded&&!Q.vignette){c.globalCompositeOperation='multiply';c.fillStyle=P.gr;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';}
  for(const p of pops){const k=p.life/1.4,s=1+Math.sin(Math.min(1,k*4)*Math.PI)*.3;c.globalAlpha=1-k*k;c.save();c.translate(p.x,p.y-k*20);c.scale(s,s);txt(p.s,0,0,44,{shadow:'rgba(255,170,80,.9)'});c.restore();}
  c.globalAlpha=1;
  if(bA)bloomDraw();
  if(Q.flare)lensFlare(sun);
  if(Q.vignette){
    if(graded){if(gvKey!==P.gr){gvKey=P.gr;gvX.setTransform(1,0,0,1,0,0);gvX.fillStyle=P.gr;gvX.fillRect(0,0,gvC.width,gvC.height);gvX.drawImage(vigC,0,0,gvC.width,gvC.height);}
      c.globalCompositeOperation='multiply';c.drawImage(gvC,0,0,W,H);c.globalCompositeOperation='source-over';}
    else c.drawImage(vigC,0,0,W,H);}
  if(Q.grain){c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='overlay';c.globalAlpha=.06;c.translate(Math.random()*128|0,Math.random()*128|0);c.fillStyle=noisePat;c.fillRect(-128,-128,cv.width+128,cv.height+128);c.restore();}
  if(flash>0){c.fillStyle=`rgba(255,250,240,${flash*.7})`;c.fillRect(0,0,W,H);}
  if(snap&&(state!=='play'||paused)){snapc.drawImage(cv,0,0);}
  layoutBtns();
  if(state==='play'){const pop=pipes.some(p=>p.scored&&bird.x-(p.x+PW/2)<20)?1.12:1;c.save();c.translate(W/2,84+SAT);c.scale(pop,pop);txt(String(score),0,0,72,{shadow:'rgba(0,0,0,.5)'});c.restore();if(!paused)drawPauseBtn();}
  if(state==='menu')drawMenu();
  if(state==='dead')drawDead();
  if(paused&&state==='play'){c.fillStyle='rgba(3,6,20,.35)';c.fillRect(0,0,W,H);glass(W/2-120,H*.42-60,240,120,24);txt('PAUSED',W/2,H*.42-12,40);txt('Tap to resume',W/2,H*.42+28,16,{w:400});}
  if(state!=='play'||paused)drawGear();
  if(state!=='play')drawSkinBtn();
  drawMute();
  if(set.fps)txt(fpsTxt,W/2,H-14,12,{w:600,fill:'rgba(255,255,255,.85)'});
}

function openSkins(){if(!skBuilt)buildSkins();skSel=set.skin;skOpen=true;skEl.classList.add('open');skRefresh();requestAnimationFrame(skFrame);}
function closeSkins(){skOpen=false;skEl.classList.remove('open');}
skEl.addEventListener('click',e=>{const d=e.target.closest('.card');if(d){skSel=d.dataset.id;skRefresh();ensureAudio();const id=skSel;loadCalls(id,()=>{if(skOpen&&skSel===id)birdCall('ten',id,.8);});}});
skE.addEventListener('click',()=>{if(set.skin===skSel)return;set.skin=skSel;saveSet();buildBirdSprites();skRefresh();loadCalls(set.skin);});
document.getElementById('skX').addEventListener('click',closeSkins);
skEl.addEventListener('pointerdown',e=>{if(e.target===skEl)closeSkins();e.stopPropagation();});

if(location.hash==='#settings'){setTimeout(()=>{openSettings();history.replaceState(null,'',location.pathname);},250);}

// ---------- updates ----------
const IS_PWA=!!window.SKYFLAP_PWA,IS_BETA_WEB=IS_PWA&&/\/beta\/?$/.test(location.pathname.replace(/index\.html$/,''));
if(IS_BETA_WEB&&!+set.betaUnlocked){set.betaUnlocked=1;}
const host=(()=>{
  const D=window.skyflapDesktop;
  if(D&&D.update)return {info:()=>D.update.info(),check:(ch,f)=>D.update.check(ch,f),restart:()=>D.update.restart(),install:()=>D.update.install(),on:f=>D.update.on(f)};
  if(window.SKYFLAP_PWA&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    const st={appVersion:null,gameVersion:window.SKYFLAP_GAME_VERSION,status:'idle',ready:null,app:null,progress:0,error:''},L=[];let reg=null;
    const emit=()=>L.forEach(f=>f(Object.assign({},st)));
    const ready=()=>fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>v,()=>({version:'new'})).then(v=>{st.ready={version:v.version||'new',notes:v.notes||''};st.status='ready';emit();});
    const watch=w=>{if(!w)return;const on=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ready();};w.addEventListener('statechange',on);on();};
    navigator.serviceWorker.register('sw.js').then(r=>{reg=r;if(r.waiting)watch(r.waiting);r.addEventListener('updatefound',()=>{if(navigator.serviceWorker.controller){st.status='downloading';emit();}watch(r.installing);});}).catch(e=>{st.status='error';st.error=String(e.message||e);});
    let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload();}});
    return {info:async()=>Object.assign({},st),
      check:async()=>{if(!reg||st.ready)return;st.status='checking';emit();try{await reg.update();}catch(e){}setTimeout(()=>{if(st.status==='checking'){st.status=navigator.onLine===false?'error':'uptodate';if(st.status==='error')st.error='offline';emit();}},3000);},
      restart:async()=>{const w=reg&&reg.waiting;if(w)w.postMessage('skipWaiting');else location.reload();},install:async()=>{},on:f=>L.push(f)};
  }
  const N=window.SkyflapNative;
  if(N)return {info:async()=>JSON.parse(N.info()),check:async(ch,f)=>N.check2?N.check2(ch||'stable',!!f):N.check(),restart:async()=>N.restart(),install:async()=>N.installApp(),on:f=>{window.__skyflapUpdate=x=>f(typeof x==='string'?JSON.parse(x):x);}};
  return null;})();
let updState=null,updHidden=false;
function updCheck(force){if(!host)return;try{host.check(set.channel==='beta'?'beta':'stable',force);}catch(e){}}
const updEl=document.getElementById('upd'),updT=document.getElementById('updT'),updGo=document.getElementById('updGo');
const iosTip=window.SKYFLAP_PWA&&/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&(()=>{try{return !localStorage.getItem('skyflap_tip');}catch(e){return true;}})();
function updRender(){
  const u=updState;let show=false;
  if(iosTip&&!updHidden&&state!=='play'){updT.innerHTML='<b>Install Skyflap</b><br>Tap Share \u2192 Add to Home Screen';updGo.textContent='OK';updGo.style.display='';
    updGo.onclick=()=>{updHidden=true;try{localStorage.setItem('skyflap_tip','1');}catch(e){}updRender();};updEl.classList.add('show');return;}
  if(u&&!updHidden&&(state!=='play'||paused)){
    if(u.status==='restarting'){updT.innerHTML='<b>Update installed</b> – restarting…';updGo.style.display='none';show=true;}
    else if(u.status==='error'&&u.app){updT.innerHTML=`<b>App update failed</b><br>${(u.error||'').replace(/[<>&]/g,'')}`;updGo.textContent='Retry';updGo.onclick=()=>host.install();updGo.style.display='';show=true;}
    else if(u.status==='installing'){updT.innerHTML=`<b>Downloading app update</b> ${u.progress?Math.round(u.progress*100)+'%':''}`;updGo.style.display='none';show=true;}
    else if(u.ready){updT.innerHTML=`<b>Skyflap ${u.ready.version}${set.channel==='beta'?' (test)':''}</b> is ready${u.ready.notes?'<br>'+u.ready.notes:''}`;updGo.textContent='Restart';updGo.onclick=()=>host.restart();updGo.style.display='';show=true;}
    else if(u.app){updT.innerHTML=`<b>App update ${u.app.version}</b> available${u.app.notes?'<br>'+u.app.notes:''}`;updGo.textContent='Install';updGo.onclick=()=>host.install();updGo.style.display='';show=true;}
  }
  updEl.classList.toggle('show',show);
}
document.getElementById('updNo').addEventListener('click',()=>{updHidden=true;updRender();});
updEl.addEventListener('pointerdown',e=>e.stopPropagation());
if(iosTip)setTimeout(updRender,600);
if(host){
  host.on(s=>{updState=s;updRender();if(setOpen)buildSettings();});
  host.info().then(s=>{updState=s;updRender();}).catch(()=>{});
  if(+set.autoupd)setTimeout(()=>updCheck(false),2500);
}
// ---------- loop with automatic quality scaling ----------
let last=performance.now(),perfAcc=0,perfN=-60,fpsN=0,fpsT=0,fpsTxt='',fpsVal=0;
let lastR=-1e9;
function loop(now){
  requestAnimationFrame(loop);
  const cap=set.cap==='max'?0:+set.cap;if(cap){const iv=1000/cap;if(now-lastR<iv-1.5)return;lastR=now-lastR>iv*2?now:lastR+iv;}
  const raw=(now-last)/1000;last=now;const dt=clamp(raw,0,1/30);
  update(dt);render();
  if(ac&&(frame&7)===0)ambUpdate();
  if(host&&(frame&15)===0)updRender();
  fpsN++;fpsT+=raw;if(fpsT>=.5){fpsVal=Math.round(fpsN/fpsT);fpsTxt=fpsVal+' FPS';fpsN=0;fpsT=0;if(setOpen)updateStatus();}
  if(set.preset==='auto'&&!setOpen&&raw>0&&raw<.25&&!document.hidden){perfN++;if(perfN>0){perfAcc+=raw;
    if(perfN>=45){const avg=perfAcc/perfN;
      if(avg>(cap?1.25/cap:1/52)){if(autoLvl<3){autoLvl++;applyPreset(LADDER[autoLvl]);}else if(dprScale>.6)dprScale=Math.max(.6,dprScale-.15);else perfN=-1e9;saveSet();resize();}
      perfAcc=0;if(perfN>0)perfN=-30;}}}
}
requestAnimationFrame(loop);
})();
</script>
</body>
